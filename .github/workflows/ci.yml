name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run mlx-stt --version
      - run: uv run mlx-stt --help

  build-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra build
      - run: uv run python scripts/build_release.py
      - name: Smoke-test release artifact
        shell: bash
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv run python scripts/smoke_release.py "dist/mlx-stt-${VERSION}-macos-arm64.tar.gz" --skip-probe
